<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Your Comfort Place</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      // Zmenšení fotek před nahráním.
      //
      // Fotky z mobilu mají 5–10 MB. Decap je posílá přes Netlify Git Gateway
      // do GitHub API a větší soubory GitHub odmítne hláškou „Sorry, your input
      // was too large to process“, takže nejde uložit celý článek.
      //
      // Tenhle skript zachytí výběr souboru dřív než Decap, fotku zmenší na
      // max. 2000 px po delší straně a uloží jako JPEG. Výsledek má obvykle
      // 300–800 kB, což je pro web stejně správná velikost.
      (function () {
        var MAX_SIDE = 2000;
        var QUALITY = 0.82;
        var LIMIT = 4 * 1024 * 1024; // nad tímhle už nahrání nezkoušíme
        var SKIP = '__ycpResized';

        function isImage(file) {
          return /^image\//.test(file.type) || /\.(heic|heif)$/i.test(file.name);
        }

        function loadImage(file) {
          if (window.createImageBitmap) {
            return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () {
              return loadViaImg(file);
            });
          }
          return loadViaImg(file);
        }

        function loadViaImg(file) {
          return new Promise(function (resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
            img.src = url;
          });
        }

        function resize(file) {
          // GIF a SVG necháme být (animace, vektor).
          if (!isImage(file) || /gif|svg/.test(file.type)) return Promise.resolve(file);
          return loadImage(file).then(function (img) {
            var w = img.width, h = img.height;
            var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
            // Malý JPEG, který se nemusí zmenšovat, necháme beze změny.
            if (scale === 1 && file.size < 1024 * 1024 && /jpe?g/.test(file.type)) return file;
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w * scale);
            canvas.height = Math.round(h * scale);
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; // průhledné PNG by v JPEG zčernalo
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            return new Promise(function (resolve) {
              canvas.toBlob(function (blob) {
                if (!blob) return resolve(file);
                var name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                resolve(new File([blob], name, { type: 'image/jpeg', lastModified: Date.now() }));
              }, 'image/jpeg', QUALITY);
            });
          }).catch(function () {
            // Prohlížeč fotku neumí přečíst (typicky HEIC v Chrome).
            return file;
          });
        }

        document.addEventListener('change', function (e) {
          var input = e.target;
          if (!input || input.type !== 'file' || input[SKIP] || !input.files || !input.files.length) {
            if (input) input[SKIP] = false;
            return;
          }
          var files = Array.prototype.slice.call(input.files);
          if (!files.some(isImage)) return;

          // Decap dostane událost až se zmenšenými soubory.
          e.stopImmediatePropagation();
          e.preventDefault();

          Promise.all(files.map(resize)).then(function (out) {
            var big = out.filter(function (f) { return f.size > LIMIT; });
            if (big.length) {
              var heic = big.some(function (f) { return /\.(heic|heif)$/i.test(f.name); });
              alert(
                'Fotka „' + big[0].name + '“ je moc velká (' + (big[0].size / 1048576).toFixed(1) +
                ' MB) a nešla by uložit.\n\n' +
                (heic
                  ? 'Je ve formátu HEIC, který tenhle prohlížeč neumí zmenšit. Otevři admin v Safari, nebo fotku nejdřív ulož jako JPEG.'
                  : 'Zmenši ji prosím a zkus to znovu.')
              );
              input.value = '';
              return;
            }
            var dt = new DataTransfer();
            out.forEach(function (f) { dt.items.add(f); });
            input.files = dt.files;
            input[SKIP] = true;
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
        }, true);
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
